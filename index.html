<!DOCTYPE html>
<html lang="zh-CN">

<body>
<!-- 主题要在第一帧之前定下来。
     原来只在 app.js 的 boot 里 applyTheme，那时页面已经用深色渲染过一帧，
     于是「浅色模式下下拉刷新会先闪一下深色」—— 刷新是整页重载，每次都会重演。
     这里在 body 刚创建、内容还没解析时就把 light 类挂上，第一帧就是浅色。 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('mm_theme') || '';
    if (t.indexOf('light') >= 0) {
      document.body.classList.add('light');
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#f3f6fb');
    }
  } catch (e) {}
})();
</script>

<div class="topbar">
  <header class="hdr">
    <div class="brand">
      <span class="bdot"></span>
      <span class="bname">异动<em>看板</em></span>
      <span class="ver-pill" id="verPill" title="版本号自动取自 sw.js 的缓存版本，不再手写">v280</span>
      <span class="shell-pill" id="shellPill" title="原生 App 壳版本（网页加载自线上，和壳版本独立）">壳?</span>
    </div>
    <div class="hdr-right">
      <span id="clock" class="clock">--:--:--</span>
      <button id="btnTheme" class="theme-btn" title="切到浅色主题">☀</button>
      <span id="srcStatus" class="src-pill">连接中</span>
      <button id="btnDemo" class="demo-btn" title="演示：插入一条标注为【演示】的示例数据（非真实新闻）">演</button>
    </div>
  </header>

  <div class="ticker" id="ticker">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div id="alarmBanner" class="alarm"></div>
</div>

<!-- 异动弹窗（任何页面都能看到） -->
<div class="toasts" id="toasts"></div>
<!-- v101：应用内下拉刷新提示条（接管浏览器原生整页重载） -->
<div class="pull-hint" id="pullHint">下拉刷新快讯</div>
<!-- 右下角常驻「未归因异动」红胶囊已下线（用户反馈：一直挡着内容，矩阵页已有完整信息） -->

<main class="main">

  <!-- ==================== 快讯 ==================== -->
  <section id="view-feed" class="view on">
    <div class="feed-bar">
      <div class="flt-line">
        <span class="flt-lab">级别</span>
        <div class="filters grades" id="gradeFilters">
          <button data-g="key" class="on">重点<b>0</b></button>
          <button data-g="S" class="f-s">S<b>0</b></button>
          <button data-g="A" class="f-a">A<b>0</b></button>
          <button data-g="B" class="f-b">B<b>0</b></button>
          <button data-g="all" class="f-all">全部<b>0</b></button>
        </div>
      </div>
      <div class="flt-line">
        <span class="flt-lab">类别</span>
        <div class="filters topics" id="topicFilters"></div>
      </div>
      <div class="snr" id="snr"></div>
      <div class="srcgrid" id="srcGrid"></div>
    </div>
    <div class="feed" id="feedList"></div>
  </section>

  <!-- ==================== 异动矩阵 ==================== -->
  <section id="view-radar" class="view">
    <div class="sec-h">
      <h2>异动矩阵</h2>
      <button class="sec-act" id="radarTest">自检一次</button>
    </div>
    <div class="radar-sum" id="radarSummary"></div>
    <div class="mx-grid" id="mxGrid"></div>
    <div id="radarActive"></div>
    <div class="sec-h sm"><h2>异动日志</h2><span class="sec-tip" id="radarTick">--</span></div>
    <div class="radar-log" id="radarLog"></div>
  </section>

  <!-- ==================== 事件追踪 ==================== -->
  <section id="view-event" class="view">
    <div class="sec-h">
      <h2>事件追踪</h2>
      <button class="sec-act" id="eventEdit">编辑</button>
      <button class="sec-act" id="eventBack" hidden>← 返回</button>
    </div>
    <div id="eventBody"></div>
  </section>

  <!-- ==================== 赚钱效应指标（insum 市场宽度，iframe 嵌入） ==================== -->
  <section id="view-effect" class="view">
    <!-- v266：控制条由主站提供（与行情页同款 mini-btn），iframe 内不再自带 header -->
    <div class="eff-bar" id="effBar">
      <span class="eff-status"><i class="eff-dot" id="effDot"></i><span id="effStatusText">加载中…</span></span>
      <button class="mini-btn" id="effCompare" type="button">对比模式</button>
      <button class="mini-btn" id="effFull" type="button">全屏</button>
    </div>
    <iframe id="effectFrame" src="about:blank" data-src="./sse/index.html?embed=1"
            allow="fullscreen" allowfullscreen scrolling="no"
            title="上证 · insum 同期对比"></iframe>
  </section>

  <!-- ==================== 行情 ==================== -->
  <section id="view-market" class="view">
    <div class="mkt-bar" id="mktBar">
      <div class="mkt-acts">
        <button class="mini-btn" id="mktChg" title="各组卡片内部按涨跌幅排序：关闭→降序→升序循环，分组卡片位置不变">按涨跌</button>
        <button class="mini-btn" id="mktSess" title="开市的市场自动往前顶">时段优先</button>
        <button class="mini-btn" id="mktSpTog" title="每行名称与价格之间显示分时小图预览">分时预览</button>
        <button class="mini-btn" id="mktEdit">编辑</button>
        <!-- v201：添加品种从列表最底部挪到「编辑」右侧的放大镜，股票多了不用一直往下翻 -->
        <button class="mini-btn mkt-search" id="mktAdd" title="添加品种" aria-label="添加品种">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>
        </button>
      </div>
    </div>
    <div class="mkt-cats" id="mktCats"></div>
    <div id="mktNote" class="mkt-note-bar" hidden></div>
    <div id="marketBody"></div>
    <div class="mkt-foot">
      <p class="mkt-note">非交易时段显示最后成交价；加密同时给出链上池子价，美股盘前盘后可看延展时段。</p>
    </div>
  </section>

  <!-- ==================== 设置 ==================== -->
  <section id="view-set" class="view">
    <div class="sec-h"><h2>设置</h2></div>
    <div id="setBody"></div>
  </section>

</main>

<nav class="tabbar" id="tabs">
  <button data-tab="feed" class="on"><i>◎</i><span>快讯</span><em class="tab-dot" hidden>0</em></button>
  <button data-tab="event"><i>◉</i><span>事件</span></button>
  <button data-tab="radar"><i>◈</i><span>矩阵</span></button>
  <button data-tab="effect"><i>▤</i><span>赚钱效应</span></button>
  <button data-tab="market"><i>≡</i><span>行情</span></button>
  <button data-tab="set"><i>⚙</i><span>设置</span></button>
</nav>

<div id="sheet" class="sheet"></div>
<div id="sModal" class="smodal"></div>
<div id="picker" class="picker"></div>
<div id="keyPanel" class="keyp"></div>

<!-- v287：账号 SDK 改为 async 且排在 app.js 之后。它此前是同步脚本，
     会让整个 HTML 解析停下等 CDN（实测 0.35~1.24s），而 boot() 挂在
     DOMContentLoaded 上，等于每段首屏都被外部 SDK 拖住。async 后
     DOMContentLoaded 不再等它；account.js 的 sdk() 已有明确容错。 -->
<script async src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js?v=293"></script>
