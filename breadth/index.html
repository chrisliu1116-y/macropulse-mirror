<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>市场宽度 · XY_BASE</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="hd-l">
      <h1>市场宽度</h1>
      <span class="sub">XY_BASE · INSUM 全A股</span>
    </div>
    <div class="hd-r">
      <span class="dot" id="dot"></span>
      <span id="gen">加载中</span>
    </div>
  </header>

  <section class="cards" id="cards">
    <div class="card k-main">
      <i>符合总数</i>
      <b id="vTotal">--</b>
      <u id="dTotal"></u>
    </div>
    <div class="card">
      <i>当日家数<em class="tag" id="vDayTag"></em></i>
      <b id="vDay">--</b>
      <u id="dDay"></u>
    </div>
    <div class="card">
      <i>当日新增</i>
      <b id="vNew">--</b>
      <u id="dNew"></u>
    </div>
    <div class="card">
      <i>将剔除</i>
      <b id="vRm">--</b>
      <u id="dRm"></u>
    </div>
  </section>

  <section class="chartbox">
    <div class="lg" id="lg"></div>
    <div class="cvwrap"><canvas id="cv"></canvas></div>
    <div class="tip" id="tip"></div>
  </section>

  <nav class="ranges" id="ranges">
    <button data-n="30" class="on">30日</button>
    <button data-n="60">60日</button>
    <button data-n="120">120日</button>
    <button data-n="0">全部</button>
    <button id="btnFit" class="fit" title="回到全景">⤢</button>
  </nav>

  <footer class="ft" id="ft"></footer>
</div>
<script src="assets/app.js?v=4"></script>
</body>
</html>
